<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-SOA Archive Mockup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home">
  <div class="home-bg" aria-hidden="true"></div>
  <div class="home-overlay" aria-hidden="true"></div>

  <header class="site-header site-header--home">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="brand-text">
        <div class="brand-title">U-SOA</div>
        <div class="brand-subtitle">UOU, School of Architecture</div>
      </div>
    </div>

    <button class="menu-button" type="button" aria-label="menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="home-main">
    <nav class="year-list" aria-label="Archive years">
      <button class="year-link" type="button" data-year="2023">2023</button>
      <button class="year-link" type="button" data-year="2024">2024</button>
      <button class="year-link" type="button" data-year="2025">2025</button>
      <button class="year-link" type="button" data-year="2026">2026</button>
    </nav>
  </main>

  <footer class="home-footer">
    <p>울산대학교 건축·도시환경학부 건축학(5년) 트랙</p>
    <p>U-SOA, School of Architecture, University of Ulsan</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
